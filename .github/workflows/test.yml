name: Test AirfoilSplines
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: airfoil-splines-for-fusion
      - uses: actions/checkout@v4
        with:
          repository: mr33g/airfoil-splines-core
          ref: main
          token: ${{ secrets.AIRFOILFIT_READ_TOKEN }}
          persist-credentials: false
          path: airfoil-splines-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r airfoil-splines-for-fusion/requirements.txt
      - name: Bundle shared core
        run: python airfoil-splines-for-fusion/setup/prepare_core.py
      - name: Run offline add-in tests
        working-directory: airfoil-splines-for-fusion
        env:
          PYTHONPATH: _vendor
        run: python -m unittest discover -s tests -v
