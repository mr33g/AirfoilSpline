name: Test AirfoilSpline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: AirfoilSpline
      - uses: actions/checkout@v4
        with:
          repository: mr33g/AirfoilFit
          ref: 738fd73da9480369df3e8504a0630773af8f8264
          token: ${{ secrets.AIRFOILFIT_READ_TOKEN }}
          persist-credentials: false
          path: AirfoilFit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r AirfoilSpline/requirements.txt
      - name: Bundle shared core
        run: python AirfoilSpline/setup/prepare_core.py
      - name: Run offline add-in tests
        working-directory: AirfoilSpline
        env:
          PYTHONPATH: _vendor
        run: python -m unittest discover -s tests -v
